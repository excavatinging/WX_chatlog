name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install offline-check dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run repository release gate
        run: python scripts/repo_check.py

      - name: Run static and dependency security audits
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install "bandit==1.9.4" "pip-audit==2.10.1"
          python -m bandit -q -r scripts
          python -m pip_audit -r requirements.txt
